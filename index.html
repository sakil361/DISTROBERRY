<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Picker + WhatsApp Send</title>
<style>

  .price-tag{
  font-size:14px;
  color:#9fb0c3;
  margin-left:auto;
  margin-right:12px;
  opacity:0.9;
}

  :root { --bg:#0b0f14; --card:#121821; --muted:#9fb0c3; --accent:#26d07c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial,sans-serif;background:var(--bg);color:#e9f0f6}
  header{position:sticky;top:0;background:#0b0f14;z-index:20;padding:18px 16px;border-bottom:1px solid #1f2732}
  .title{font-size:26px;font-weight:700}
  input,textarea{background:#0f1520;border:2px solid red;border-radius:10px;color:#e9f0f6;padding:12px 14px;width:100%}
  .ok{border-color:limegreen!important}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .container{max-width:980px;margin:0 auto;padding:16px}
  .cat{margin:18px 0 8px;font-weight:700;opacity:.95}
  .product,.brand{background:var(--card);border:1px solid #1f2732;border-radius:14px;margin:12px 0;padding:14px}
  .head{display:flex;justify-content:space-between;cursor:pointer;align-items:center;gap:10px}
  .flavours,.brand-content{display:none;padding-top:10px;border-top:1px dashed #2a3545;margin-top:10px}
  .chip{display:flex;justify-content:space-between;align-items:center;background:#0f1520;border:1px solid #243244;padding:8px;border-radius:10px;margin:6px 0;position:relative}
  .qty{display:flex;gap:6px;align-items:center}
  .qty input{width:54px;text-align:center}
  .selected{border-color:var(--accent)}
  .sticky-send{position:sticky;bottom:0;background:#0b0f14;border-top:1px solid #1f2732;padding:12px 16px}
  .btn{background:var(--accent);border:none;border-radius:10px;padding:14px;font-weight:700;width:100%;cursor:pointer;opacity:.6}
  .btn.enabled{opacity:1}
  #summary{margin-top:8px;font-size:13px;color:#9fb0c3}
  .badge{display:inline-block;background:#142033;border:1px solid #263448;color:#cfe0f5;border-radius:999px;padding:4px 8px;font-size:12px;margin-left:6px}
  .fallback{display:none;background:#111a28;border:1px solid #24364a;border-radius:10px;padding:12px 14px;margin:12px 16px}
  .fallback a{color:#7cdfff}
  .fallback textarea{background:#0f1520;border:1px solid #203040;color:#cfe0f5;border-radius:8px;padding:8px;width:100%}
  
  .subcat{margin:6px 0 4px;color:#b7c7da;font-weight:600}
  .brand .head h2{margin:0;font-size:18px}
  .brand .head button,.product .head button{padding:6px 10px;border-radius:10px;border:1px solid #263445;background:#172131;color:#cfe0f5}

  /* Out-of-stock styling */
  .oos{
    opacity:.45;
    filter:grayscale(1);
  }
  .oos::after{
    content:"Out of stock";
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    font-size:12px;
    color:#9fb0c3;
    background:#1a2535;
    border:1px solid #2a3648;
    padding:2px 6px;
    border-radius:999px;
  }
  .oos .qty button,
  .oos .qty input{
    pointer-events:none;
    opacity:.6;
  }
</style>
</head>
<body>

<header>
  <div class="title">Place Your Order <span class="badge">WhatsApp: +44 7466 492227</span></div>
  <input id="bizNumber" type="tel" value="447466492227" style="display:none;" />
</header>


<div class="container" id="list"></div>

<div class="sticky-send">
  <button id="sendBtn" class="btn" disabled>Send Order via WhatsApp</button>
  <div id="summary">No items selected yet.</div>
</div>

<div id="fallbackBox" class="fallback">
  <div><strong>If your browser blocks the WhatsApp popup:</strong></div>
  <ol>
    <li>Tap one of these links: <a id="waMeLink" href="#" target="_blank" rel="noopener">Open with wa.me</a> · <a id="apiLink" href="#" target="_blank" rel="noopener">Open with api.whatsapp.com</a></li>
    <li>Or copy this message and paste into WhatsApp:</li>
  </ol>
  <textarea id="rawMessage" rows="6" readonly></textarea>
</div>
<!-- Checkout Modal (no preview) -->
<style>
  /* Modal — match site theme */
  dialog:not([open]) { display: none; }
  dialog{
    background: var(--card);
    color: #e9f0f6;
    border: 1px solid #1f2732;
    border-radius: 16px;
    padding: 16px;
    max-width: 560px;
    width: 96vw;
    box-shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  dialog::backdrop{ background: rgba(0,0,0,.6); }

  .modal-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .modal-header h3{ margin:0; font-size:20px; }

  .modal-actions{ display:flex; gap:8px; margin-top:12px; }

  /* Buttons inside dialog */
  .btn-ghost{
    background:#162232;
    border:1px solid #263448;
    color:#cfe0f5;
    border-radius:10px;
    padding:10px 12px;
    cursor:pointer;
  }
  #confirmSend{
    background:var(--accent);
    color:#0b0f14;
    border:none;
    border-radius:10px;
    padding:12px 14px;
    font-weight:700;
    cursor:pointer;
  }

  /* Inputs in dialog reuse your global styles, but ensure full width on narrow screens */
  #checkoutDialog input, #checkoutDialog textarea{ width:100%; }
</style>

<dialog id="checkoutDialog">
  <div class="modal-header">
    <h3>Enter details to send order</h3>
    <button id="closeDialog" class="btn-ghost" formmethod="dialog">✕</button>
  </div>

  <div class="row">
    <input id="custNameModal" type="text" placeholder="Customer name (required)" required />
    <input id="custNumberModal" type="tel" inputmode="tel" placeholder="Customer number (required)" required />
  </div>
  <div class="row">
    <textarea id="notesModal" placeholder="Additional info (optional)"></textarea>
  </div>

  <div class="modal-actions">
    <button id="cancelDialog" class="btn-ghost" formmethod="dialog">Cancel</button>
    <button id="confirmSend" class="btn enabled">Send Order via WhatsApp</button>
  </div>
</dialog>

function requiredFilled(){ return true; }

function updateSummary(){
  const summary = document.getElementById('summary');
  const sendBtn = document.getElementById('sendBtn');
  const items = [];

  Object.entries(window.cart).forEach(([product, arr])=>{
    arr.forEach(({flavour, qty})=> items.push(product + ' — ' + flavour + ' x ' + qty));
  });

  if(items.length===0){
    summary.textContent='No items selected yet.';
  } else {
    summary.textContent = items.length + ' item(s) ready to send.';
  }

  // Safely handle (now-removed) header inputs
  const nameEl = document.getElementById('custName');
  const numEl  = document.getElementById('custNumber');
  if (nameEl) nameEl.classList.toggle('ok', !!nameEl.value.trim());
  if (numEl)  numEl.classList.toggle('ok',  !!numEl.value.trim());

  // Enable based on cart only (fields collected in modal)
  const enable = items.length > 0;
  sendBtn.disabled = !enable;
  sendBtn.classList.toggle('enabled', enable);
}

  Object.entries(window.cart).forEach(([product, arr])=>{
    lines.push('- ' + product);
    arr.forEach(({flavour, qty})=> lines.push('  - ' + flavour + ' x' + qty));
  });
  if(extra) lines.push('Notes: ' + extra);
  return lines.join('\n');
}

function normalizePhone(raw){
  const digits = (raw||'').replace(/\D/g,'');
  if(digits.startsWith('00')) return digits.slice(2);
  if(digits.startsWith('0'))  return '44' + digits.slice(1);
  return digits;
}

function setFallbackLinks(text, phone){
  const waMe = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
  const api  = 'https://api.whatsapp.com/send?phone=' + phone + '&text=' + encodeURIComponent(text);
  document.getElementById('waMeLink').href = waMe;
  document.getElementById('apiLink').href  = api;
  document.getElementById('rawMessage').value = text;
  document.getElementById('fallbackBox').style.display = 'block';
}

function safeOpen(url){
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

(function () {
  // --- Helpers ---
  function hasItems() {
    return Object.values(window.cart || {}).some(arr => Array.isArray(arr) && arr.length > 0);
  }
  function normalizePhoneIntl(raw) {
    const d = (raw||'').replace(/\D/g,'');
    if (d.startsWith('00')) return d.slice(2);
    if (d.startsWith('0'))  return '44' + d.slice(1);
    return d;
  }

  // --- 1) Make updateSummary ignore name/number and enable by cart only ---
  if (typeof window.updateSummary === 'function') {
    const old = window.updateSummary;
    window.updateSummary = function(){
      try { old.apply(this, arguments); } catch(_) {}
      const itemsCount = Object.values(window.cart || {}).reduce((n, arr) => n + (Array.isArray(arr) ? arr.length : 0), 0);
      const btn = document.getElementById('sendBtn');
      if (btn) { btn.disabled = itemsCount === 0; btn.classList.toggle('enabled', itemsCount > 0); }
    };
    try { window.updateSummary(); } catch(_) {}
  }

  // Also neutralize any old "requiredFilled" checks (fields moved to modal)
  window.requiredFilled = function(){ return true; };

  // --- 2) Replace the main button's old click handler with our modal opener ---
  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) {
    const replacement = sendBtn.cloneNode(true);
    sendBtn.parentNode.replaceChild(replacement, sendBtn);
    replacement.addEventListener('click', () => {
      if (!hasItems()) { alert('Please add at least one item.'); return; }
      const dlg = document.getElementById('checkoutDialog');
      if (!dlg) { alert('Checkout dialog not found.'); return; }
      if (typeof dlg.showModal === 'function') dlg.showModal();
      else dlg.setAttribute('open',''); // fallback for older browsers
    });
  }

  // --- 3) Modal buttons ---
  const dlgEl = document.getElementById('checkoutDialog');
  document.getElementById('closeDialog')?.addEventListener('click', () => { dlgEl?.close?.(); dlgEl?.removeAttribute('open'); });
  document.getElementById('cancelDialog')?.addEventListener('click', () => { dlgEl?.close?.(); dlgEl?.removeAttribute('open'); });

  document.getElementById('confirmSend')?.addEventListener('click', () => {
    const name  = document.getElementById('custNameModal')?.value?.trim();
    const num   = document.getElementById('custNumberModal')?.value?.trim();
    const notes = document.getElementById('notesModal')?.value?.trim();
    if (!name || !num) { alert('Please enter name and number.'); return; }

    // Build WhatsApp message
    const lines = [];
    lines.push(`Name: ${name}`);
    lines.push(`Customer Number: ${num}`);
    lines.push('Order:');
    Object.entries(window.cart || {}).forEach(([product, arr]) => {
      lines.push(`- ${product}`);
      (arr || []).forEach(({ flavour, qty }) => lines.push(`  - ${flavour} x${qty}`));
    });
    if (notes) lines.push(`Notes: ${notes}`);

    // Send via WhatsApp
    const phone = normalizePhoneIntl(document.getElementById('bizNumber')?.value || '447466492227');
    const text  = encodeURIComponent(lines.join('\n'));
    const waMe  = `https://wa.me/${phone}?text=${text}`;
    const api   = `https://api.whatsapp.com/send?phone=${phone}&text=${text}`;
    // Open both to maximize compatibility
    try { window.open(waMe, '_blank'); } catch(_) {}
    try { window.open(api, '_blank'); } catch(_) {}

    // Optional: if your page has fallbackBox helpers, wire them
    if (typeof window.setFallbackLinks === 'function') {
      try { window.setFallbackLinks(lines.join('\n'), phone); } catch(_) {}
    }

    dlgEl?.close?.(); dlgEl?.removeAttribute('open');
  });
})();
</script>
